<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BTC 30m | {% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">BTC 30m <span>موديل التوقع</span></div>
    <nav>
      <a href="{{ url_for('page_model') }}" class="{{ 'on' if active=='model' }}">الموديل والبيانات</a>
      <a href="{{ url_for('page_live') }}" class="{{ 'on' if active=='live' }}">التحليل المباشر</a>
      <a href="{{ url_for('page_results') }}" class="{{ 'on' if active=='results' }}">النتائج</a>
      <a href="{{ url_for('page_admin') }}" class="{{ 'on' if active=='admin' }}">خاص</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>توقع تجريبي للاختبار والبحث فقط، وليس ضماناً للربح ولا نصيحة مالية.</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
